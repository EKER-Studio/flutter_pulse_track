# .continue/config.yaml

models:
  - title: LM Studio Main
    provider: openai
    model: AUTODETECT
    apiBase: http://localhost:1234/v1
    roles:
      - chat
      - edit
      - apply
    systemMessage: |
      Follow repository rules in .continue/rules/*.md (AGENTS.md is SSOT).
      Scope discipline: only modify files explicitly named or directly referenced.
      This repo uses Riverpod 3.x (@riverpod generator) strictly; do not suggest BLoC/Provider.
      Do not claim analyze/test/build_runner passed unless you ran them and saw output.
      Keep changes minimal and testable.
    completionOptions:
      temperature: 0.2

tabAutocompleteModel:
  title: LM Studio Main (TAB)
  provider: openai
  apiBase: http://localhost:1234/v1
  model: AUTODETECT
  completionOptions:
    temperature: 0.1
    maxTokens: 256

embeddingsProvider:
  provider: openai
  apiBase: http://localhost:1234/v1
  model: text-embedding-nomic-embed-text-v1.5

contextProviders:
  - name: code
  - name: diff
  - name: problems
  - name: terminal
  - name: folder
  - name: search
  - name: docs

docs:
  - name: Flutter Docs
    startUrl: https://docs.flutter.dev/
  - name: Dart Language
    startUrl: https://dart.dev/language
  - name: Riverpod
    startUrl: https://riverpod.dev/
  - name: Isar (community)
    startUrl: https://isar.dev/

customCommands:
  - name: flutter:verify
    description: Print the mandatory verification pipeline (per AGENTS.md)
    prompt: |
      Output the exact mandatory verification pipeline to run after lib/** changes,
      in strict order, with short notes on what each step verifies.
      Remind: do not claim success without actual output.

  - name: flutter:fix
    description: Diagnose and propose minimal fix from logs
    prompt: |
      Diagnose the issue from the logs/stacktrace below.
      Then propose the smallest safe change aligned with Clean Architecture + Riverpod 3.x + Isar streams.
      Include which pipeline steps to run afterwards (per AGENTS.md).
      LOGS:
      {{input}}

  - name: flutter:feature-plan
    description: Plan a feature using the repo’s feature-first Clean Architecture
    prompt: |
      Create a small-step implementation plan for: "{{input}}"
      Use the existing structure:
      lib/features/<feature>/{domain,data,presentation}/
      Riverpod 3.x only (@riverpod code generation), Isar streams for reactivity, Clean Architecture.
      Include file list + minimal diffs + test strategy.

  - name: flutter:riverpod-review
    description: Review a Riverpod Notifier / provider for lifecycle/disposal correctness
    prompt: |
      Review the provided Riverpod/Notifier code for:
      - StreamSubscription cancellation in ref.onDispose()
      - Timer/AnimationController disposal (if any)
      - Correct Isar stream lifecycle management and AsyncValue piping
      - Proper use of @riverpod code generation and auto-dispose
      Provide specific changes (minimal diffs).